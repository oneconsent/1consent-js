name: Publish npm

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Stage/publish the selected release tag (npm-v* for the SDK, npm-site-check-v* for the site check; a -beta.N version stages under beta, a plain version under latest), or verify it after npm approval
        required: true
        default: publish
        type: choice
        options:
          - publish
          - verify
      release_tag:
        description: Existing immutable release tag to verify when dispatching from main; leave empty when publishing
        required: false
        type: string
      publisher:
        description: Use a stage-only token for the first release, then the configured trusted publisher
        required: true
        default: trusted-publisher
        type: choice
        options:
          - trusted-publisher
          - bootstrap-token

permissions:
  contents: read

env:
  NPM_PUBLIC_SOURCE_REPOSITORY: oneconsent/1consent-js

concurrency:
  group: npm-release-lane
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate immutable release tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      line: ${{ steps.release.outputs.line }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      dist_tag: ${{ steps.release.outputs.dist_tag }}
      environment: ${{ steps.release.outputs.environment }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Derive the release line, version and channel
        id: release
        env:
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
          WORKFLOW_REF: ${{ github.ref }}
          OPERATION: ${{ inputs.operation }}
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$OPERATION" == "verify" && "$WORKFLOW_REF" == "refs/heads/main" ]]; then
            RELEASE_TAG="$REQUESTED_RELEASE_TAG"
          else
            if [[ "$REF_TYPE" != "tag" ]]; then
              echo "Publishing requires an immutable release tag; branch verification requires main." >&2
              exit 1
            fi
            if [[ -n "$REQUESTED_RELEASE_TAG" ]]; then
              echo "release_tag is only allowed for read-only verification from main." >&2
              exit 1
            fi
          fi
          stable_version='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)'
          beta_version="${stable_version}-beta\\.(0|[1-9][0-9]*)"
          # Each release line owns one tag prefix, and each version pattern one channel; keep
          # these in step with NPM_RELEASE_LINES and NPM_RELEASE_CHANNELS in scripts/npm-release-lines.mjs.
          if [[ "$RELEASE_TAG" =~ ^npm-v(${stable_version}|${beta_version})$ ]]; then
            release_line=sdk
            release_version="${RELEASE_TAG#npm-v}"
          elif [[ "$RELEASE_TAG" =~ ^npm-site-check-v(${stable_version}|${beta_version})$ ]]; then
            release_line=site-check
            release_version="${RELEASE_TAG#npm-site-check-v}"
          else
            echo "Tag must be a release such as npm-v0.1.0 or a beta prerelease such as npm-site-check-v0.1.0-beta.0." >&2
            exit 1
          fi
          if [[ "$release_version" =~ ^${beta_version}$ ]]; then
            dist_tag=beta
            environment=npm-beta
          else
            dist_tag=latest
            environment=npm-stable
          fi
          echo "line=$release_line" >> "$GITHUB_OUTPUT"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "environment=$environment" >> "$GITHUB_OUTPUT"

      - name: Checkout complete release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tagged commit to be reviewed on main
        id: source
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          tagged_commit="$(git rev-parse HEAD)"
          if [[ "$OPERATION" == "publish" && "$tagged_commit" != "$(git rev-parse "${GITHUB_SHA}^{commit}")" ]]; then
            echo "Publishing must use the exact dispatched tag commit." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tagged_commit" "refs/remotes/origin/main"; then
            echo "The npm release tag must point to a commit contained in main." >&2
            exit 1
          fi
          echo "commit=$tagged_commit" >> "$GITHUB_OUTPUT"

  publish:
    name: Build and stage npm release
    if: inputs.operation == 'publish'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ needs.prepare.outputs.environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout tagged release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Require a public provenance release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REPOSITORY" != "$NPM_PUBLIC_SOURCE_REPOSITORY" ]]; then
            echo "Publishing is restricted to $NPM_PUBLIC_SOURCE_REPOSITORY; refusing $GITHUB_REPOSITORY." >&2
            exit 1
          fi
          visibility="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility)"
          if [[ "$visibility" != "public" ]]; then
            echo "npm provenance requires this tagged release repository to be public." >&2
            exit 1
          fi

      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install the verified npm release CLI
        run: npm install --global npm@12.2.0

      - name: Validate release package manifests
        env:
          RELEASE_LINE: ${{ needs.prepare.outputs.line }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          DIST_TAG: ${{ needs.prepare.outputs.dist_tag }}
        run: |
          expected_repository="git+https://github.com/${NPM_PUBLIC_SOURCE_REPOSITORY}.git"
          require() {
            if [[ "$(jq -r "$2" "$1")" != "$3" ]]; then
              echo "$1: $2 must be $3." >&2
              exit 1
            fi
          }
          package_names="$(node scripts/npm-release-lines.mjs packages --line "$RELEASE_LINE")"
          for package_name in $package_names; do
            manifest="packages/libs/$package_name/package.json"
            require "$manifest" .version "$RELEASE_VERSION"
            require "$manifest" '.private // false' false
            require "$manifest" .repository.url "$expected_repository"
            require "$manifest" .publishConfig.access public
            require "$manifest" .publishConfig.provenance true
            require "$manifest" .publishConfig.registry https://registry.npmjs.org/
            require "$manifest" .publishConfig.tag "$DIST_TAG"
          done

      - name: Scan the exact tracked release
        run: npm run check:secrets

      - name: Run release-boundary tests
        run: npm test

      - name: Verify exact artifacts and clean tarball installation
        run: npm run verify:npm-packages

      - name: Detect idempotent registry actions
        id: registry
        env:
          RELEASE_LINE: ${{ needs.prepare.outputs.line }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          PUBLISHER_MODE: ${{ inputs.publisher }}
        run: |
          registry_state="$(node scripts/npm-release-state.mts --line "$RELEASE_LINE" --version "$RELEASE_VERSION" --publisher "$PUBLISHER_MODE")"
          printf '%s\n' "$registry_state" >> "$GITHUB_OUTPUT"
          printf '%s\n' "$registry_state" > "$RUNNER_TEMP/npm-registry-state.txt"

      - name: Stage reviewed packages for npm 2FA approval
        env:
          PUBLISHER_MODE: ${{ inputs.publisher }}
          NPM_BOOTSTRAP_TOKEN: ${{ inputs.publisher == 'bootstrap-token' && secrets.NPM_BOOTSTRAP_TOKEN || '' }}
          RELEASE_LINE: ${{ needs.prepare.outputs.line }}
          DIST_TAG: ${{ needs.prepare.outputs.dist_tag }}
          STAGE_PACKAGES: ${{ steps.registry.outputs.to_stage }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISHER_MODE" == "bootstrap-token" ]]; then
            if [[ -z "$NPM_BOOTSTRAP_TOKEN" ]]; then
              echo "NPM_BOOTSTRAP_TOKEN must be a stage-only token without 2FA bypass." >&2
              exit 1
            fi
            export NODE_AUTH_TOKEN="$NPM_BOOTSTRAP_TOKEN"
          elif [[ "$PUBLISHER_MODE" == "trusted-publisher" ]]; then
            unset NODE_AUTH_TOKEN
          else
            echo "Unknown npm publisher mode." >&2
            exit 1
          fi
          if [[ "$DIST_TAG" != "beta" && "$DIST_TAG" != "latest" ]]; then
            echo "Unknown npm release channel." >&2
            exit 1
          fi
          line_packages=" $(node scripts/npm-release-lines.mjs packages --line "$RELEASE_LINE") "
          for package_name in $STAGE_PACKAGES; do
            if [[ "$line_packages" != *" $package_name "* ]]; then
              echo "Unexpected package for the $RELEASE_LINE release line." >&2
              exit 1
            fi
          done
          for package_name in $STAGE_PACKAGES; do
            (cd "packages/libs/$package_name" && npm stage publish --tag "$DIST_TAG" --access public --provenance)
          done

      - name: Record the publication result
        env:
          RELEASE_LINE: ${{ needs.prepare.outputs.line }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          DIST_TAG: ${{ needs.prepare.outputs.dist_tag }}
        run: |
          {
            echo "## npm $RELEASE_VERSION ($RELEASE_LINE, $DIST_TAG)"
            grep -v '^to_stage=' "$RUNNER_TEMP/npm-registry-state.txt" | sed 's/^/- @1consent\//; s/=/: /'
            echo ""
            echo "Approve staged packages with npm 2FA, then rerun this workflow with operation=verify."
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify public registry and provenance
    if: inputs.operation == 'verify'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout tagged release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Load the reviewed verifier from this workflow commit
        env:
          VERIFIER_COMMIT: ${{ github.sha }}
        run: |
          git show "${VERIFIER_COMMIT}:scripts/verify-npm-provenance.mts" > "$RUNNER_TEMP/verify-npm-provenance.mts"
          git show "${VERIFIER_COMMIT}:scripts/npm-release-lines.mjs" > "$RUNNER_TEMP/npm-release-lines.mjs"

      - name: Set up Node.js for registry verification
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install the verified npm release CLI
        run: npm install --global npm@12.2.0

      - name: Reverify the exact tagged release
        run: |
          npm run check:secrets
          npm test
          npm run verify:npm-packages

      - name: Bind registry versions to the tagged tarballs
        env:
          RELEASE_LINE: ${{ needs.prepare.outputs.line }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: node scripts/npm-release-state.mts --line "$RELEASE_LINE" --version "$RELEASE_VERSION" --require-published

      - name: Install and execute the exact SDK release
        if: needs.prepare.outputs.line == 'sdk'
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/npm-consumer"
          cd "$RUNNER_TEMP/npm-consumer"
          npm init --yes
          npm pkg set private=true type=module
          npm install --ignore-scripts --save-exact \
            "@1consent/react@$RELEASE_VERSION" \
            "@1consent/nextjs@$RELEASE_VERSION" \
            "@1consent/cli@$RELEASE_VERSION" \
            "next@^16.0.0" \
            "react@^19.0.0" \
            "react-dom@^19.0.0"
          ./node_modules/.bin/1c --help | grep -q "Manage 1Consent"
          ./node_modules/.bin/1c typegen --help | grep -q -- "--app <shortId>"
          node --input-type=module --eval \
            'import * as sdk from "@1consent/react"; import * as nextSdk from "@1consent/nextjs"; import { parseConsentCookie } from "@1consent/nextjs/server"; import { designKit } from "@1consent/cli/design-kit"; for (const name of ["OneConsent", "OneConsentProvider", "useConsent"]) { if (typeof sdk[name] !== "function") throw new Error(`Missing React export ${name}`); if (typeof nextSdk[name] !== "function") throw new Error(`Missing Next.js export ${name}`); } if (parseConsentCookie(undefined, {}, 0) !== "none") throw new Error("Next.js server helper did not fail closed"); if (typeof designKit !== "function") throw new Error("Missing designKit export");'
          node --conditions=react-server --input-type=module --eval \
            'import * as sdk from "@1consent/nextjs"; if ("useConsent" in sdk) throw new Error("Next.js RSC export leaks useConsent"); for (const name of ["OneConsent", "OneConsentProvider"]) if (typeof sdk[name] !== "function") throw new Error(`Missing Next.js RSC export ${name}`);'

      - name: Install and execute the exact site check release
        if: needs.prepare.outputs.line == 'site-check'
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/npm-consumer"
          cd "$RUNNER_TEMP/npm-consumer"
          npm init --yes
          npm pkg set private=true type=module
          npm install --ignore-scripts --save-exact "@1consent/site-check@$RELEASE_VERSION"
          ./node_modules/.bin/oneconsent-site-check --version | grep -q "^Site check specification "

      - name: Verify exact release provenance
        env:
          RELEASE_LINE: ${{ needs.prepare.outputs.line }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_REF: refs/tags/${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_ENVIRONMENT: ${{ needs.prepare.outputs.environment }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/npm-consumer"
          npm audit signatures --json --include-attestations > npm-audit-signatures.json
          node "$RUNNER_TEMP/verify-npm-provenance.mts" \
            --audit-report npm-audit-signatures.json \
            --line "$RELEASE_LINE" \
            --version "$RELEASE_VERSION" \
            --repository "$NPM_PUBLIC_SOURCE_REPOSITORY" \
            --workflow .github/workflows/publish-npm.yml \
            --ref "$RELEASE_REF" \
            --commit "$RELEASE_COMMIT" \
            --environment "$RELEASE_ENVIRONMENT"

      - name: Record verified public installation
        env:
          RELEASE_LINE: ${{ needs.prepare.outputs.line }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          DIST_TAG: ${{ needs.prepare.outputs.dist_tag }}
        run: |
          {
            echo "## Verified npm $RELEASE_VERSION ($RELEASE_LINE, $DIST_TAG)"
            echo "Every $RELEASE_LINE package matches the tagged tarballs, install and execute, own the $DIST_TAG dist-tag, and have npm-verified provenance bound to this repository, workflow, tag, commit, and protected environment."
          } >> "$GITHUB_STEP_SUMMARY"
