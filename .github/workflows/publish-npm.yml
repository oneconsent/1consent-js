name: Publish npm beta

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Stage/publish the selected beta tag, or verify it after npm approval
        required: true
        default: publish
        type: choice
        options:
          - publish
          - verify
      release_tag:
        description: Existing immutable beta tag to verify when dispatching from main; leave empty when publishing
        required: false
        type: string
      publisher:
        description: Use a stage-only token for the first release, then the configured trusted publisher
        required: true
        default: trusted-publisher
        type: choice
        options:
          - trusted-publisher
          - bootstrap-token

permissions:
  contents: read

env:
  NPM_PUBLIC_SOURCE_REPOSITORY: oneconsent/1consent-js

concurrency:
  group: npm-beta-release-lane
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate immutable beta tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.source.outputs.commit }}
    steps:
      - name: Derive the prerelease version
        id: release
        env:
          REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
          WORKFLOW_REF: ${{ github.ref }}
          OPERATION: ${{ inputs.operation }}
          REQUESTED_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$OPERATION" == "verify" && "$WORKFLOW_REF" == "refs/heads/main" ]]; then
            RELEASE_TAG="$REQUESTED_RELEASE_TAG"
          else
            if [[ "$REF_TYPE" != "tag" ]]; then
              echo "Publishing requires an immutable beta tag; branch verification requires main." >&2
              exit 1
            fi
            if [[ -n "$REQUESTED_RELEASE_TAG" ]]; then
              echo "release_tag is only allowed for read-only verification from main." >&2
              exit 1
            fi
          fi
          if [[ ! "$RELEASE_TAG" =~ ^npm-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-beta\.(0|[1-9][0-9]*)$ ]]; then
            echo "Tag must be a beta prerelease such as npm-v0.1.0-beta.0." >&2
            exit 1
          fi
          echo "version=${RELEASE_TAG#npm-v}" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout complete release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require the tagged commit to be reviewed on main
        id: source
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          tagged_commit="$(git rev-parse HEAD)"
          if [[ "$OPERATION" == "publish" && "$tagged_commit" != "$(git rev-parse "${GITHUB_SHA}^{commit}")" ]]; then
            echo "Publishing must use the exact dispatched tag commit." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$tagged_commit" "refs/remotes/origin/main"; then
            echo "The npm release tag must point to a commit contained in main." >&2
            exit 1
          fi
          echo "commit=$tagged_commit" >> "$GITHUB_OUTPUT"

  publish:
    name: Build and stage npm beta
    if: inputs.operation == 'publish'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: npm-beta
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout tagged release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false

      - name: Require a public provenance release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REPOSITORY" != "$NPM_PUBLIC_SOURCE_REPOSITORY" ]]; then
            echo "Publishing is restricted to $NPM_PUBLIC_SOURCE_REPOSITORY; refusing $GITHUB_REPOSITORY." >&2
            exit 1
          fi
          visibility="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility)"
          if [[ "$visibility" != "public" ]]; then
            echo "npm provenance requires this tagged release repository to be public." >&2
            exit 1
          fi

      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install the verified npm release CLI
        run: npm install --global npm@12.2.0

      - name: Validate beta package manifests
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          expected_repository="git+https://github.com/${NPM_PUBLIC_SOURCE_REPOSITORY}.git"
          for package_dir in packages/libs/react packages/libs/nextjs packages/libs/cli; do
            manifest="$package_dir/package.json"
            [[ "$(jq -r .version "$manifest")" == "$RELEASE_VERSION" ]]
            [[ "$(jq -r '.private // false' "$manifest")" == "false" ]]
            [[ "$(jq -r .repository.url "$manifest")" == "$expected_repository" ]]
            [[ "$(jq -r .publishConfig.access "$manifest")" == "public" ]]
            [[ "$(jq -r .publishConfig.provenance "$manifest")" == "true" ]]
            [[ "$(jq -r .publishConfig.registry "$manifest")" == "https://registry.npmjs.org/" ]]
            [[ "$(jq -r .publishConfig.tag "$manifest")" == "beta" ]]
          done

      - name: Scan the exact tracked release
        run: npm run check:secrets

      - name: Run release-boundary tests
        run: npm test

      - name: Verify exact artifacts and clean tarball installation
        run: npm run verify:npm-packages

      - name: Detect idempotent registry actions
        id: registry
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          PUBLISHER_MODE: ${{ inputs.publisher }}
        run: node scripts/npm-release-state.mts --version "$RELEASE_VERSION" --publisher "$PUBLISHER_MODE" >> "$GITHUB_OUTPUT"

      - name: Stage reviewed packages for npm 2FA approval
        env:
          PUBLISHER_MODE: ${{ inputs.publisher }}
          NPM_BOOTSTRAP_TOKEN: ${{ inputs.publisher == 'bootstrap-token' && secrets.NPM_BOOTSTRAP_TOKEN || '' }}
          REACT_STATE: ${{ steps.registry.outputs.react }}
          NEXTJS_STATE: ${{ steps.registry.outputs.nextjs }}
          CLI_STATE: ${{ steps.registry.outputs.cli }}
        run: |
          set -euo pipefail
          if [[ "$PUBLISHER_MODE" == "bootstrap-token" ]]; then
            if [[ -z "$NPM_BOOTSTRAP_TOKEN" ]]; then
              echo "NPM_BOOTSTRAP_TOKEN must be a stage-only token without 2FA bypass." >&2
              exit 1
            fi
            export NODE_AUTH_TOKEN="$NPM_BOOTSTRAP_TOKEN"
          elif [[ "$PUBLISHER_MODE" == "trusted-publisher" ]]; then
            unset NODE_AUTH_TOKEN
          else
            echo "Unknown npm publisher mode." >&2
            exit 1
          fi
          package_names=(react nextjs cli)
          registry_states=("$REACT_STATE" "$NEXTJS_STATE" "$CLI_STATE")
          for registry_state in "${registry_states[@]}"; do
            if [[ "$registry_state" != "bootstrap" && "$registry_state" != "stage" ]]; then
              if [[ "$registry_state" != "published" ]]; then
                echo "Unexpected registry state." >&2
                exit 1
              fi
            fi
          done
          for index in "${!package_names[@]}"; do
            package_name="${package_names[$index]}"
            if [[ "${registry_states[$index]}" == "published" ]]; then
              continue
            fi
            (cd "packages/libs/$package_name" && npm stage publish --tag beta --access public --provenance)
          done

      - name: Record the publication result
        env:
          CLI_STATE: ${{ steps.registry.outputs.cli }}
          NEXTJS_STATE: ${{ steps.registry.outputs.nextjs }}
          REACT_STATE: ${{ steps.registry.outputs.react }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          {
            echo "## npm beta $RELEASE_VERSION"
            echo "- @1consent/react: $REACT_STATE"
            echo "- @1consent/nextjs: $NEXTJS_STATE"
            echo "- @1consent/cli: $CLI_STATE"
            echo ""
            echo "Approve staged packages with npm 2FA, then rerun this workflow with operation=verify."
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify public registry and provenance
    if: inputs.operation == 'verify'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout tagged release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Load the reviewed verifier from this workflow commit
        env:
          VERIFIER_COMMIT: ${{ github.sha }}
        run: git show "${VERIFIER_COMMIT}:scripts/verify-npm-provenance.mts" > "$RUNNER_TEMP/verify-npm-provenance.mts"

      - name: Set up Node.js for registry verification
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Install the verified npm release CLI
        run: npm install --global npm@12.2.0

      - name: Reverify the exact tagged release
        run: |
          npm run check:secrets
          npm test
          npm run verify:npm-packages

      - name: Bind registry versions to the tagged tarballs
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          registry_state="$(node scripts/npm-release-state.mts --version "$RELEASE_VERSION")"
          if [[ "$registry_state" != $'react=published\nnextjs=published\ncli=published' ]]; then
            echo "All exact local tarballs must already own the npm beta channel." >&2
            printf '%s\n' "$registry_state" >&2
            exit 1
          fi

      - name: Install, execute, and verify exact release provenance
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_REF: refs/tags/${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: |
          set -euo pipefail
          consumer_dir="$(mktemp -d)"
          trap 'rm -rf "$consumer_dir"' EXIT
          cd "$consumer_dir"
          npm init --yes
          npm pkg set private=true type=module
          npm install --ignore-scripts --save-exact \
            "@1consent/react@$RELEASE_VERSION" \
            "@1consent/nextjs@$RELEASE_VERSION" \
            "@1consent/cli@$RELEASE_VERSION" \
            "next@^16.0.0" \
            "react@^19.0.0" \
            "react-dom@^19.0.0" \
            "zod@^4.0.0"
          ./node_modules/.bin/1c --help | grep -q "Manage 1Consent"
          ./node_modules/.bin/1c typegen --help | grep -q -- "--app <shortId>"
          node --input-type=module --eval \
            'import * as sdk from "@1consent/react"; import * as nextSdk from "@1consent/nextjs"; import { parseConsentCookie } from "@1consent/nextjs/server"; import { designKit } from "@1consent/cli/design-kit"; for (const name of ["OneConsent", "OneConsentProvider", "useConsent"]) { if (typeof sdk[name] !== "function") throw new Error(`Missing React export ${name}`); if (typeof nextSdk[name] !== "function") throw new Error(`Missing Next.js export ${name}`); } if (parseConsentCookie(undefined, {}, 0) !== "none") throw new Error("Next.js server helper did not fail closed"); if (typeof designKit !== "function") throw new Error("Missing designKit export");'
          node --conditions=react-server --input-type=module --eval \
            'import * as sdk from "@1consent/nextjs"; if ("useConsent" in sdk) throw new Error("Next.js RSC export leaks useConsent"); for (const name of ["OneConsent", "OneConsentProvider"]) if (typeof sdk[name] !== "function") throw new Error(`Missing Next.js RSC export ${name}`);'
          npm audit signatures --json --include-attestations > npm-audit-signatures.json
          node "$RUNNER_TEMP/verify-npm-provenance.mts" \
            --audit-report npm-audit-signatures.json \
            --version "$RELEASE_VERSION" \
            --repository "$NPM_PUBLIC_SOURCE_REPOSITORY" \
            --workflow .github/workflows/publish-npm.yml \
            --ref "$RELEASE_REF" \
            --commit "$RELEASE_COMMIT" \
            --environment npm-beta

      - name: Record verified public installation
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          {
            echo "## Verified npm beta $RELEASE_VERSION"
            echo "All three scoped packages match the tagged tarballs, install and execute, own the beta dist-tag, and have npm-verified provenance bound to this repository, workflow, tag, commit, and protected environment."
          } >> "$GITHUB_STEP_SUMMARY"
